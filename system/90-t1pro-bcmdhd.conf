# FLSun T1 Pro: /etc/NetworkManager/conf.d/90-t1pro-bcmdhd.conf
# The Broadcom bcmdhd Wi-Fi driver (AP6212A) cannot change its MAC address: NetworkManager's
# random scan MAC makes it power-cycle the chip, the change fails -> "config-failed" and
# NetworkManager gives up after 4 tries. Never touch the MAC.
[device]
wifi.scan-rand-mac-address=no

[connection]
wifi.cloned-mac-address=permanent
ethernet.cloned-mac-address=permanent
