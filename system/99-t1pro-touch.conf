# FLSun T1 Pro: touch controller tlsc6x (event "tlsc6x_touch")
# Axes swapped, Y mirrored, small offset/scale. The matrix is FLSun's own tslib calibration
# (/etc/pointercal: -719 62098 1205500 -65727 81 17556672 65536 480 272) converted to
# libinput's normalized CalibrationMatrix for 480x272.
# Install to /etc/X11/xorg.conf.d/99-t1pro-touch.conf
Section "InputClass"
    Identifier "T1 Pro Touch"
    MatchProduct "tlsc6x_touch"
    MatchIsTouchscreen "on"
    Driver "libinput"
    Option "CalibrationMatrix" "-0.010971 0.536939 0.038322 -1.769849 0.001236 0.984903 0 0 1"
EndSection
