# FLSun T1 Pro: chamber light as Moonraker power device (added by scripts/setup_light.sh)
# GPIO108 of the Linux board = bank gpio3, line 12. N in gpiochipN is detected by the script
# (usually gpiochip3). Needs the udev rule system/60-gpiochip.rules.
[power Light]
type: gpio
pin: gpiochip3/gpio12
initial_state: on
