# FLSun T1 Pro - printer.cfg for UPSTREAM Klipper (v0.13) on Debian 12 (SD card)
# Project: https://github.com/BehaviorBean/flsun-t1pro-debian12-klipper  (GPL-3.0)
#
# Based on the FLSun stock printer.cfg (firmware 2025). Works with the UNCHANGED FLSun
# mainboard firmware (Klipper v0.10.0-439-gdfa5afdf) - no MCU flashing required.
#
# Differences to the FLSun stock config (search for "CHANGED"):
#  - FLSun-only modules removed: power_loss_recover, save_temp_variables, box_light,
#    locate_printing_gcode, rotate_logger, timelapse include, FLSun commands F100/F104/F108
#  - Pause/Resume/Cancel come from mainsail.cfg (park position in _CLIENT_VARIABLE below)
#  - safety: min_temp 0 instead of -200/-5, idle_timeout 30 min instead of 48 h
#  - FLSun-only options (normal_minimum_z_position, RunoutDebounceHelper,
#    max_accel_to_decel) replaced/removed
#  - relay PD6 = power for the HOTEND HEATER (FLSun's heaters.py switched it automatically):
#    on at start, off on shutdown/idle; M104/M109/SET_HEATER_TEMPERATURE switch it on
#  - ADXL345 / resonance_tester disabled: the FLSun MCU firmware speaks an older ADXL
#    protocol ("Command format mismatch: query_adxl345"). Input shaper values from the
#    SAVE_CONFIG block stay active. Re-enable only after flashing current Klipper firmware.
#  - bed mesh "default" is loaded 2 s after Klipper start (upstream no longer auto-loads it;
#    G28 does not clear it) -> also works for old G-code from the FLSun slicer profile
#  - [exclude_object] enabled, empty TIMELAPSE_* placeholders (FLSun slicer profile)
#  - LOAD/UNLOAD_FILAMENT heat up by themselves; LIGHT_ON/LIGHT_OFF/F106 switch the chamber
#    light through the Moonraker power device [power Light] (see config/moonraker-light.conf)
#  - box fan (PE2) removed - has no function on the T1 Pro (also not in the stock system)
#
# The SAVE_CONFIG block (delta calibration, bed mesh, PID, input shaper) is NOT part of this
# file. scripts/install_printer_cfg.sh appends the block from YOUR stock printer.cfg.
# Afterwards run BED_LEVEL_1 and BED_LEVEL_2 (see README).

[include mainsail.cfg]

####################################################################################################
# Motors
####################################################################################################
[stepper_a]
step_pin: PE5
dir_pin: !PD7
enable_pin: !PE1
microsteps: 32
rotation_distance: 60
endstop_pin: ^PD4
homing_speed: 40

[stepper_b]
step_pin: PB9
dir_pin: !PC7
enable_pin: !PD3
microsteps: 32
rotation_distance: 60
endstop_pin: ^PD14

[stepper_c]
step_pin: PB8
dir_pin: !PE15
enable_pin: !PD13
microsteps: 32
rotation_distance: 60
endstop_pin: ^PE10

[extruder]
step_pin: PD15
dir_pin: !PB0
enable_pin: !PB1
microsteps: 16
rotation_distance: 4.5
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA5
sensor_type: Generic 3950
pullup_resistor: 510          # FLSun special value (hardware pull-up) - do not change
sensor_pin: PA4
min_temp: 0                   # CHANGED: FLSun -200 -> a broken thermistor wire would not be detected
max_temp: 320
max_extrude_cross_section: 50
max_extrude_only_distance: 500
pressure_advance: 0.025
control: pid
pid_Kp: 14.155
pid_Ki: 0.303
pid_Kd: 165.086

[tmc5160 stepper_a]
cs_pin: PB4
spi_software_sclk_pin: PE0
spi_software_miso_pin: PB3
spi_software_mosi_pin: PD5
sense_resistor: 0.0375
run_current: 3
hold_current: 1.6
stealthchop_threshold: 0
interpolate: true

[tmc5160 stepper_b]
cs_pin: PC6
spi_software_sclk_pin: PD0
spi_software_miso_pin: PA8
spi_software_mosi_pin: PD1
sense_resistor: 0.0375
run_current: 3
hold_current: 1.6
stealthchop_threshold: 0
interpolate: true

[tmc5160 stepper_c]
cs_pin: PD9
spi_software_sclk_pin: PD10
spi_software_miso_pin: PD8
spi_software_mosi_pin: PD11
sense_resistor: 0.0375
run_current: 3
hold_current: 1.6
stealthchop_threshold: 0
interpolate: true

[tmc5160 extruder]
cs_pin: PC4
spi_software_sclk_pin: PA7
spi_software_mosi_pin: PA6
spi_software_miso_pin: PC5
sense_resistor: 0.0375
run_current: 1.2
hold_current: 0.3

####################################################################################################
# MCU, heaters, fans, sensors
####################################################################################################
[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method: command

[fan]
pin: !PE6
cycle_time: 0.0001
max_power: 0.6

[heater_fan heat_sink_fan]
pin: PE8
heater_temp: 50.0

[heater_bed]
heater_pin: PA2
sensor_pin: PA1
sensor_type: Generic 3950
min_temp: 0                   # CHANGED: FLSun -5
max_temp: 130
control: pid
pid_Kp: 18.240
pid_Ki: 0.558
pid_Kd: 149.109

[temperature_sensor host]     # CHANGED: name (FLSun "Armv7 mcu") - temperature of the Linux board
sensor_type: temperature_host
min_temp: -50
max_temp: 100

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: -50
max_temp: 100

[input_shaper]

[filament_switch_sensor filament_sensor]
pause_on_runout: False
runout_gcode:
    M117 Filament Runout Detected!
    PAUSE
switch_pin: !PE7
# CHANGED: FLSun option "helper: RunoutDebounceHelper" removed (FLSun Klipper only)
event_delay: 3.0              # CHANGED: FLSun 0.0001

[printer]
kinematics: delta
max_velocity: 1000
max_accel: 30000
minimum_cruise_ratio: 0.7     # CHANGED: replaces FLSun "max_accel_to_decel: 8000" (removed in current Klipper)
square_corner_velocity: 5
max_z_velocity: 1000
print_radius: 133
minimum_z_position: -2        # CHANGED: FLSun -5 (safety margin for the pressure-sensor probe)
# CHANGED: "normal_minimum_z_position" removed (FLSun Klipper only)

####################################################################################################
# Calibration
####################################################################################################
[delta_calibrate]
radius: 120
horizontal_move_z: 10
speed: 100

[probe]
pin: !PA3
x_offset: 0
y_offset: 0
z_offset: -0.18
speed: 10
samples: 2
samples_result: average
sample_retract_dist: 5
samples_tolerance: 0.05
samples_tolerance_retries: 5

[bed_mesh]
speed: 50
horizontal_move_z: 7
mesh_radius: 125
mesh_origin: 0, 0
round_probe_count: 7
algorithm: bicubic
fade_start: 0.2
fade_end: 0.0
fade_target: 0

#[resonance_tester]
#probe_points: 0, 0, 20
#accel_chip: adxl345
#min_freq: 30
#max_freq: 50
#accel_per_hz: 250

#[adxl345]
#cs_pin: PE11
#spi_software_sclk_pin: PE14
#spi_software_mosi_pin: PE13
#spi_software_miso_pin: PE12
#rate: 1600

#####################################################################################################
## Outputs and macros
#####################################################################################################
[output_pin relay_pin]        # relay = power for the hotend heater (found in FLSun heaters.py)
pin: PD6
pwm: False
value: 1                      # on at start
shutdown_value: 0             # off on Klipper error / emergency stop -> extra cut-off for the hotend heater

[verify_heater extruder]      # values as in FLSun Klipper
hysteresis: 6
max_error: 150

[gcode_macro M104]
rename_existing: M104.1
gcode:
    {% if params.S is defined and params.S|float > 0 %}
        relay_on
    {% endif %}
    M104.1 {rawparams}

[gcode_macro M109]
rename_existing: M109.1
gcode:
    {% if params.S is defined and params.S|float > 0 %}
        relay_on
    {% endif %}
    M109.1 {rawparams}

[gcode_macro SET_HEATER_TEMPERATURE]
rename_existing: _SET_HEATER_TEMPERATURE_BASE
gcode:
    {% if params.HEATER|default('')|lower == 'extruder' and params.TARGET|default(0)|float > 0 %}
        relay_on
    {% endif %}
    _SET_HEATER_TEMPERATURE_BASE {rawparams}

[gcode_macro relay_on]
gcode:
    SET_PIN PIN=relay_pin VALUE=1

[gcode_macro relay_off]
gcode:
    SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
    SET_PIN PIN=relay_pin VALUE=0

# REMOVED: [output_pin BOXFAN_pin] (PE2) + boxfan_on/boxfan_off - no function on the T1 Pro

[gcode_macro ZUP]
gcode:
    SET_GCODE_OFFSET Z_ADJUST=0.025 MOVE=1

[gcode_macro ZDOWN]
gcode:
    SET_GCODE_OFFSET Z_ADJUST=-0.025 MOVE=1

[gcode_macro BED_LEVEL_1]     # CHANGED: without FLSun command F104
description: Delta calibration (bed 60 / nozzle 140 C), then SAVE_CONFIG
gcode:
    SET_GCODE_OFFSET Z=0
    BED_MESH_CLEAR
    G28
    M204 S200
    M104 S140
    M140 S60
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM=138 MAXIMUM=145
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM=58 MAXIMUM=65
    DELTA_CALIBRATE
    G1 X0 Y0 Z50 F4200
    M104 S0
    M140 S0
    SAVE_CONFIG

[gcode_macro BED_LEVEL_2]     # CHANGED: without FLSun command F104
description: Bed mesh (bed 60 / nozzle 140 C), then SAVE_CONFIG
gcode:
    BED_MESH_CLEAR
    G28
    M204 S200
    M104 S140
    M140 S60
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM=138 MAXIMUM=145
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM=58 MAXIMUM=65
    G1 X0 Y0 Z50 F4200
    BED_MESH_CALIBRATE
    G1 X0 Y0 Z50 F4200
    M104 S0
    M140 S0
    SAVE_CONFIG

#[gcode_macro MEASURING_RESONANCES]   # CHANGED: without save_variables (needs flashed MCU)
#description: Measure input shaper, then SAVE_CONFIG
#gcode:
#    G28
#    SHAPER_CALIBRATE
#    SAVE_CONFIG

[gcode_macro UNLOAD_FILAMENT]  # CHANGED: heats up by itself if needed
description: Unload filament - heats up if needed (TEMP=220 default)
gcode:
    {% set target_before = printer.extruder.target|float %}
    {% set heat_self = target_before < 180 %}
    {% set temp = params.TEMP|default(220 if heat_self else target_before)|float %}
    {% set speed_factor = printer.gcode_move.speed_factor|float %}
    {% set extrude_factor = printer.gcode_move.extrude_factor|float %}
    {% if temp < 180 %}
        {action_raise_error("TEMP muss mindestens 180 sein")}
    {% endif %}
    M117 Heating to {temp|int} C ...
    M104 S{temp}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp - 3}
    G91
    M220 S100
    M221 S100
    G1 E10 F300
    G1 E-100 F800
    M400
    M220 S{speed_factor*100}
    M221 S{extrude_factor*100}
    G90
    {% if heat_self %}
        M104 S0
    {% endif %}
    M117 Filament unloaded

[gcode_macro LOAD_FILAMENT]    # CHANGED: heats up by itself if needed
description: Load filament - heats up if needed (TEMP=220 default)
gcode:
    {% set target_before = printer.extruder.target|float %}
    {% set heat_self = target_before < 180 %}
    {% set temp = params.TEMP|default(220 if heat_self else target_before)|float %}
    {% set speed_factor = printer.gcode_move.speed_factor|float %}
    {% set extrude_factor = printer.gcode_move.extrude_factor|float %}
    {% if temp < 180 %}
        {action_raise_error("TEMP muss mindestens 180 sein")}
    {% endif %}
    M117 Heating to {temp|int} C ...
    M104 S{temp}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp - 3}
    G91
    M220 S100
    M221 S100
    G1 E70 F800
    G1 E30 F300
    M400
    M220 S{speed_factor*100}
    M221 S{extrude_factor*100}
    G90
    {% if heat_self %}
        M104 S0
    {% endif %}
    M117 Filament loaded

# NEW: chamber light - it is connected to the Linux board (GPIO108), not to the mainboard,
# and is managed by Moonraker as power device "Light" ([power Light] in moonraker.conf)
[gcode_macro LIGHT_ON]
description: Chamber light on
gcode:
    {action_call_remote_method("set_device_power", device="Light", state="on")}

[gcode_macro LIGHT_OFF]
description: Chamber light off
gcode:
    {action_call_remote_method("set_device_power", device="Light", state="off")}

[gcode_macro F106]
description: FLSun compatible - F106 S1 = light on, F106 S0 = light off
gcode:
    {% if params.S|default(1)|int == 1 %}
        LIGHT_ON
    {% else %}
        LIGHT_OFF
    {% endif %}

[gcode_macro M600]
gcode:
    PAUSE

[gcode_macro TMC]
gcode:
    DUMP_TMC STEPPER=stepper_a
    DUMP_TMC STEPPER=stepper_b
    DUMP_TMC STEPPER=stepper_c
    DUMP_TMC STEPPER=extruder

[force_move]
enable_force_move: True

[gcode_macro RESTORE_E_CURRENT]
gcode:
    SET_TMC_CURRENT STEPPER=extruder CURRENT=1.2

[gcode_macro START_PRINT]     # CHANGED: without power-loss variables and FLSun M105 variant
gcode:
    relay_on
    SET_TMC_CURRENT STEPPER=extruder CURRENT=0.8
    UPDATE_DELAYED_GCODE ID=heatsink DURATION=0
    CLEAR_PAUSE
    M106 S255
    G28
    BED_MESH_PROFILE LOAD=default   # load bed mesh (upstream no longer loads it automatically)

[gcode_macro END_PRINT]
gcode:
    SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
    RESTORE_E_CURRENT
    M106 S255
    UPDATE_DELAYED_GCODE ID=heatsink DURATION=100

[delayed_gcode heatsink]
initial_duration: 0
gcode:
    M106 S0

[idle_timeout]
timeout: 1800                 # CHANGED: FLSun 172800 (48 h)
gcode:
    TURN_OFF_HEATERS
    M84
    SET_PIN PIN=relay_pin VALUE=0

[gcode_arcs]

[exclude_object]              # NEW: the slicer writes EXCLUDE_OBJECT_DEFINE/START/END

[delayed_gcode _LOAD_MESH_AT_STARTUP]   # NEW: load bed mesh after Klipper start
initial_duration: 2
gcode:
    {% if 'default' in printer.bed_mesh.profiles %}
        BED_MESH_PROFILE LOAD=default
    {% endif %}

[gcode_macro TIMELAPSE_TAKE_FRAME]     # NEW: placeholder (FLSun slicer profile), does nothing
description: Placeholder - no timelapse installed
gcode:

[gcode_macro TIMELAPSE_RENDER]         # NEW: placeholder (FLSun slicer profile), does nothing
description: Placeholder - no timelapse installed
gcode:

# Settings for the Pause/Resume/Cancel macros from mainsail.cfg (delta: park inside the print circle)
[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : True
variable_custom_park_x    : 0.0
variable_custom_park_y    : -110.0
variable_custom_park_dz   : 10.0
variable_retract          : 1.0
variable_cancel_retract   : 5.0
variable_park_at_cancel   : True
gcode:
