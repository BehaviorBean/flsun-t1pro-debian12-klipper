# FLSun T1 Pro: [cam 1] section for ~/printer_data/config/crowsnest.conf (Crowsnest v5)
# Camera: Hy-UXGA (B5M2), MJPG 1920x1080 up to 30 fps (YUYV 1080p only 5 fps).
#
# Frame rate depends on the exposure: fixed exposure <= 25 ms gives 30 fps but a dark image;
# auto exposure gives ~17 fps with a good image. The camera resets the exposure to auto
# whenever the stream starts, so a fixed exposure would need to be re-applied afterwards.
# backlight_compensation helps because the bright wall behind the printer otherwise makes
# auto exposure under-expose the black bed.
# Note: Crowsnest v5 names controls with brackets differently (exposure_absolute_), plain
# names like gamma/brightness work as shown.
[cam 1]
mode: ustreamer
port: 8080
device: /dev/v4l/by-id/usb-XHLC-231108-XH_Hy-UXGA_B5M2_-Camera-video-index0
resolution: 1920x1080
max_fps: 30
v4l2ctl: exposure_auto=3,backlight_compensation=2,gamma=160,brightness=16
